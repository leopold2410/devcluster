kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
# Disable disk-pressure eviction (useful on a nearly full laptop disk)
kubeadmConfigPatches:
- |
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  evictionHard:
    nodefs.available: "0%"
nodes:
- role: control-plane
- role: worker
- role: worker
