# Vault's KV v2 engine as a store for the whole cluster (update-setup-06).
# ESO requests a short-lived token for service account vault-auth, logs in to Vault's
# "kubernetes" auth method with role external-secrets, and reads with policy eso-read.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.kind.local:8200   # the kind gateway, via CoreDNS (host-services-dns.sh)
      path: secret
      version: v2
      caProvider:                              # trust-manager's copy of the local root CA
        type: ConfigMap
        name: kind-root-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          # No audiences: the token also authenticates Vault's TokenReview call, so it must
          # keep the API server's default audience.
          serviceAccountRef:
            name: vault-auth
            namespace: external-secrets
