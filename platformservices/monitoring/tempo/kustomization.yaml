apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Tempo 3, one process, local storage on a TopoLVM volume (update-setup-05, ADR-0022).
# Monolithic mode needs no Kafka. Its metrics generator turns traces into span metrics and the
# service graph and remote-writes them, with exemplars, into Prometheus.
helmCharts:
- name: tempo
  repo: https://grafana-community.github.io/helm-charts
  version: 3.0.0
  releaseName: tempo
  namespace: monitoring
  valuesInline:
    tempo:
      retention: 72h
      storage:
        trace:
          backend: local
          local: { path: /var/tempo/traces }
          wal: { path: /var/tempo/wal }
      # The chart's default jaeger receiver stays, unused - everything arrives as OTLP. It
      # cannot be removed: kustomize drops "jaeger: null" before Helm sees it, and with Helm
      # directly the chart's Service template then fails on the missing jaeger block.
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: "0.0.0.0:4317" }
            http: { endpoint: "0.0.0.0:4318" }
      metricsGenerator:
        enabled: true
        storage:
          path: /var/tempo/generator     # on the volume, not the chart's default /tmp/tempo
          remote_write:
            - url: http://prometheus-server.monitoring.svc/api/v1/write
              send_exemplars: true       # the trace ids that make metric -> trace links
      # The generator only runs the processors a tenant's overrides list; the chart's
      # default is an empty map, which would generate nothing.
      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs, span-metrics]
      resources:
        requests: { memory: 256Mi }
        limits: { memory: 768Mi }
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: topolvm
