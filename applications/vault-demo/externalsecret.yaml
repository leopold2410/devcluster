# The proof for update-setup-06: a secret written to Vault (by Terraform) appears as a
# Kubernetes Secret, and a change in Vault reaches it within the refresh interval.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-demo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello
  namespace: vault-demo
spec:
  refreshInterval: 30s                  # short, so a change in Vault is seen quickly
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: hello
  data:
    - secretKey: greeting
      remoteRef:
        key: demo/hello
        property: greeting
