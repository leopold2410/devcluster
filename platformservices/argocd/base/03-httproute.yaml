apiVersion: gateway.networking.k8s.io/v1alpha2
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
  - name: shared-gateway
    namespace: traefik
  hostnames:
  - argocd.localhost
  rules:
  - matches:
    - path:
        value: /
    backendRefs:
    - name: argocd-server
      port: 80