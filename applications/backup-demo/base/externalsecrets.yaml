# What the platform provides for this namespace: a bucket of its own in the object store, a key
# for it and the password of the restic repository in it. Created on the host by
# "objectstore/setup-host.sh backup-demo" and kept in Vault, so a rebuilt cluster gets the same
# values and finds its old backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup
  namespace: backup-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: backup
  dataFrom:
    - extract:
        key: backup/backup-demo         # access-key, secret-key, repo-password
---
# The database password, written to Vault once by ../deploy.sh. It has to stay the same across
# rebuilds: a dump does not contain it, but whoever connects to the database uses it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: backup-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: postgres
  data:
    - secretKey: password
      remoteRef:
        key: backup-demo/db
        property: password
