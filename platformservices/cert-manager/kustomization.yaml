apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager controller, webhook, cainjector and CRDs
resources:
- namespace.yaml
helmCharts:
- name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.2
  releaseName: cert-manager
  namespace: cert-manager
  valuesInline:
    crds:
      enabled: true
